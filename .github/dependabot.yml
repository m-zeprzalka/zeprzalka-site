# Aktualizacje zależności. Poprawki bezpieczeństwa przychodzą od razu (Dependabot
# security updates włączone w ustawieniach repozytorium); zwykłe aktualizacje raz
# w miesiącu, zgrupowane w jeden PR, z tygodniową karencją od publikacji wersji.
# Każdy PR przechodzi CI i strażnika strony głównej, a Vercel buduje podgląd.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
