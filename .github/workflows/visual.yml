# Strażnik zasady „wygląd strony głównej jest nietykalny bez zgody właściciela”.
# Buduje gałąź i `main`, porównuje `/` i `/en` piksel po pikselu (1440 i 390 px).
# Czerwony wynik nie blokuje technicznie — mówi, że zmiana wymaga zgody.
name: Strona główna — regresja wizualna

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
            /tmp/base/.next/cache
          key: visual-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: visual-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Gałąź — build i start (:3100)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start -p 3100 > /tmp/head.log 2>&1 &

      - name: main — build i start (:3200)
        run: |
          git worktree add /tmp/base origin/main
          cd /tmp/base
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start -p 3200 > /tmp/base.log 2>&1 &

      - name: Czekaj na oba serwery
        run: |
          for port in 3100 3200; do
            for i in $(seq 1 30); do
              curl -sf "http://localhost:$port/" > /dev/null && continue 2
              sleep 1
            done
            echo "Serwer na porcie $port nie wystartował"; cat /tmp/head.log /tmp/base.log; exit 1
          done

      - name: Porównanie pikseli
        run: pnpm visual http://localhost:3200 http://localhost:3100

      - name: Mapy różnic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: .visual/
          include-hidden-files: true
