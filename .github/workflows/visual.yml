# Porównanie pikseli strony głównej (`/`, `/en`; 1440 i 390 px) między dwiema
# wersjami. Pracujemy na jednej gałęzi (`main`), więc uruchamiamy je ręcznie
# (Actions → „Run workflow”), np. po refaktorze, który nie powinien zmienić
# wyglądu: bieżący commit kontra `base` (domyślnie poprzedni commit).
# To samo lokalnie: `pnpm visual <bazowy> <zmiana>` (README, „Kontrola wizualna”).
name: Strona główna — porównanie pikseli

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Wersja bazowa: commit, tag albo gałąź"
        default: "HEAD~1"
        required: true

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Build bez cache: ręczne, rzadkie przebiegi nie uzasadniają ~160 MB cache na commit,
      # a przywrócony cache w /tmp/base blokował `git worktree add`. Build jak na produkcji
      # (bez tras piaskownicy).
      - name: Bieżąca wersja — build i start (:3100)
        env:
          VERCEL_ENV: production
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start -p 3100 > /tmp/head.log 2>&1 &

      - name: Wersja bazowa — build i start (:3200)
        # Wejście przez zmienną środowiskową, nie wklejone w skrypt (bez wstrzyknięcia poleceń).
        env:
          BASE: ${{ inputs.base }}
          VERCEL_ENV: production
        run: |
          git worktree add /tmp/base "$BASE"
          cd /tmp/base
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start -p 3200 > /tmp/base.log 2>&1 &

      - name: Czekaj na oba serwery
        run: |
          for port in 3100 3200; do
            for i in $(seq 1 30); do
              curl -sf "http://localhost:$port/" > /dev/null && continue 2
              sleep 1
            done
            echo "Serwer na porcie $port nie wystartował"; cat /tmp/head.log /tmp/base.log; exit 1
          done

      - name: Porównanie pikseli
        run: pnpm visual http://localhost:3200 http://localhost:3100

      - name: Mapy różnic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: .visual/
          include-hidden-files: true
